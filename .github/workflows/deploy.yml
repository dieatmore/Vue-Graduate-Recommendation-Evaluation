name: 前端为主仓库-前后端独立持续部署
# 触发条件：推送到前端仓库main分支时执行
on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    name: 前端部署
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取前端仓库代码
      - name: 拉取前端代码
        uses: actions/checkout@v4

      # 步骤2：配置Node环境+缓存依赖
      - name: 配置Node.js 20（前端打包）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # 缓存npm依赖，避免重复下载
          cache-dependency-path: ./package-lock.json

      # 步骤3：前端安装依赖+打包
      - name: 前端安装依赖（国内镜像加速）
        run: |
          npm install --registry=https://registry.npmmirror.com # 加速依赖下载
          npm run build # 前端打包（Vue/React/Angular通用）
        timeout-minutes: 1 # 超时保护

      # 步骤4：部署前端到服务器
      - name: 上传前端文件到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 只部署前端静态文件，不影响后端
          script: |
            mkdir -p /www/wwwroot/recommendation/nginx/html
            rm -rf /www/wwwroot/recommendation/nginx/html/*
            scp -r ${{ github.workspace }}/dist/* root@${{ secrets.SSH_HOST }}:/root/recommendation/nginx/html/
            # 重启Nginx（可选，确保前端生效）
            docker-compose -f /root/recommendation/docker-compose.yml restart nginx

  # ========== 后端部署 Job ==========
  deploy-backend:
    name: 后端部署
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取后端仓库代码
      - name: 拉取后端仓库代码
        uses: actions/checkout@v4
        with:
          repository: dieatmore/Graduate-Recommendation-Evaluation # 后端仓库
          token: ${{ secrets.GITHUB_TOKEN }} # GitHub自动生成，无需额外配置
          path: backend # 把后端代码拉到backend目录

      # 步骤2：配置Java环境+缓存Maven依赖
      - name: 配置Java 21（后端打包）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # 缓存Maven依赖，避免重复下载
          cache-dependency-path: ./backend/pom.xml

      # 步骤3：后端Maven打包
      - name: 后端Maven打包（跳过测试+国内镜像）
        run: |
          cd backend
          # 替换Maven镜像为阿里云，加速依赖下载
          mkdir -p ~/.m2
          echo '<?xml version="1.0" encoding="UTF-8"?><settings><mirrors><mirror><id>aliyunmaven</id><mirrorOf>central</mirrorOf><url>https://maven.aliyun.com/repository/public</url></mirror></mirrors></settings>' > ~/.m2/settings.xml
          # 多线程打包+跳过测试，控制耗时在100秒左右
          mvn clean package -DskipTests -T 2C
        timeout-minutes: 3 # 超时保护

      # 步骤4：部署后端到服务器
      - name: 上传后端Jar包+重启容器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 只部署后端Jar包，不影响前端
          script: |
            rm -rf /www/wwwroot/recommendation/openjdk/graduate-recommendation-evaluation.jar
            scp ${{ github.workspace }}/backend/target/graduate-recommendation-evaluation.jar root@${{ secrets.SSH_HOST }}:/root/recommendation/openjdk/
            # 重启后端容器
            docker-compose -f /root/recommendation/docker-compose.yml restart openjdk
