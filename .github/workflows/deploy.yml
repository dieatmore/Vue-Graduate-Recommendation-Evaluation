name: 前端部署
on:
  push:
    branches: ['main']
  pull_request: # PR也触发
    branches: ['main']

jobs:
  deploy-frontend:
    name: 前端部署
    runs-on: ubuntu-latest
    steps:
      - name: 拉取前端代码
        uses: actions/checkout@v4

      - name: Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' 
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: 安装依赖
        run: |
          # 修复TS类型错误
          sed -i "s/categoryListR.value/(categoryListR.value || [])/g" src/views/main/header/IndexView.vue
          npm ci --registry=https://registry.npmmirror.com # 改用npm ci
        timeout-minutes: 1

      - name: 打包项目（
        run: npm run build --if-present
        timeout-minutes: 1

      - name: 上传前端文件（保留密钥认证，融合老师的scp-action）
        uses: appleboy/scp-action@v1 
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*'
          target: /www/wwwroot/recommendation/nginx/html
          strip_components: 1 # 只复制文件，不复制dist目录
          rm: true # 先删除目标目录文件

      - name: 重启Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/recommendation
            docker compose up --force-recreate --no-deps -d nginx

            cd /www/wwwroot/recommendation
            docker compose up --force-recreate --no-deps -d openjdk
